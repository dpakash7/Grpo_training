# Full overnight run: up to 4 hours of training per model, then the full test set.
run_name: default
seed: 42
model: Qwen/Qwen2.5-0.5B-Instruct
max_completion_tokens: 256
budget_minutes: 240
validate_every_minutes: 30
val_size: 200
eval_batch_size: 32
eval_limit: null

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]

rewards:
  correctness: 1.0
  format: 0.1
  length: 0.05
  free_chars: 700
  max_chars: 1100

grpo:
  learning_rate: 2.0e-5
  num_generations: 8
  # 32 completions per step. On a 6 GB GPU, chunks of 8 spilled out of VRAM and took 75 s/step; chunks of 4 took about 22 s.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  beta: 0.001
  # Group scaling turned the tiny length penalty into the main signal and collapsed replies in the first smoke run.
  scale_rewards: batch
  temperature: 1.0
  max_grad_norm: 1.0
  max_steps: 100000
  logging_steps: 5
  save_steps: 200

sft:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  max_length: 768
  early_stop_patience: 3
  max_grad_norm: 1.0
  max_steps: 100000
  logging_steps: 20
  save_steps: 500
